name: ci
permissions: read-all
on:
  push:
    branches:
      - main
  pull_request:
env:
  # Use the Go version mise installs instead of auto-downloading a newer
  # toolchain, so the compatibility matrix really tests the listed versions.
  GOTOOLCHAIN: local
# Tools and tasks are defined in mise.toml.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Tidy go.mod files
        run: mise run '//...:go:mod:tidy'
      - name: Run linters (applying fixes, including formatting)
        run: mise run '//...:lint' --fix
      - name: Build
        run: mise run '//...:build'
      - name: Check clean work tree
        run: mise run check-clean-work-tree

  test-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Run tests with race detector
        run: mise run test
      - name: Run each benchmark once with race detector
        run: mise run bench -benchtime=1x -race

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Run coverage tests
        run: mise run test --coverage --no-race
      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: ./coverage.out
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Store coverage test output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opentelemetry-go-test-output
          path: coverage.out

  compatibility-test:
    strategy:
      matrix:
        go-version: ["1.27.0", "1.26.0"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        # GitHub Actions does not support arm* architectures on default
        # runners. It is possible to acomplish this with a self-hosted runner
        # if we want to add this in the future:
        # https://docs.github.com/en/actions/hosting-your-own-runners/using-self-hosted-runners-in-a-workflow
        arch: ["386", amd64]
        exclude:
          # Not a supported Go OS/architecture.
          - os: macos-latest
            arch: "386"
    runs-on: ${{ matrix.os }}
    env:
      # Overrides the Go version from mise.toml.
      MISE_GO_VERSION: ${{ matrix.go-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          # Tool caches are per OS; keep one per Go version too.
          cache_key_prefix: mise-go${{ matrix.go-version }}
      - name: Run tests
        env:
          GOARCH: ${{ matrix.arch }}
        # The race detector does not support 386.
        run: mise run test --short --no-race

  # A stable check name for branch protection, so the required checks do not
  # change when the Go versions in the compatibility-test matrix are bumped.
  compatibility-test-result:
    name: Compatibility tests
    # Run even if a matrix entry failed or was cancelled. Without this the job
    # is skipped, and GitHub treats a skipped required check as passing.
    if: always()
    needs: [compatibility-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check all compatibility tests passed
        env:
          RESULT: ${{ needs.compatibility-test.result }}
        run: |
          echo "compatibility-test result: $RESULT"
          test "$RESULT" = "success"
